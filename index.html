<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="The Little Journey — a small interactive adventure to discover something you may have forgotten about yourself." />
  <title>The Little Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app">
    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <div class="aurora aurora-one" aria-hidden="true"></div>
    <div class="aurora aurora-two" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">The Little Journey</div>
      <div class="chapter-indicator" id="chapterIndicator">A little adventure</div>
    </header>

    <main id="game" class="game" aria-live="polite">
      <section id="scene" class="scene scene-intro">
        <div id="sceneVisual" class="scene-visual">
          <div class="glow-orb" id="companion" aria-hidden="true">
            <span class="orb-core"></span>
            <span class="orb-ring"></span>
          </div>
        </div>

        <div class="story-card" id="storyCard">
          <div class="eyebrow" id="eyebrow">A tiny invitation</div>
          <h1 id="title">There's a little place I want to show you.</h1>
          <div class="dialogue" id="dialogue">
            <p>Don't worry. There's no test here.</p>
            <p>Just a short journey. You can take it at your own pace.</p>
          </div>

          <div id="choices" class="choices"></div>

          <button id="primaryAction" class="primary-button" type="button">
            Follow the light <span>→</span>
          </button>

          <div id="textInputWrap" class="text-input-wrap hidden">
            <label for="futureMessage">Write one thing you want your future self to remember.</label>
            <textarea id="futureMessage" maxlength="220" placeholder="Maybe something simple..."></textarea>
            <button id="saveMessage" class="primary-button" type="button">Keep this with you ✨</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="progress" id="progress" aria-label="Journey progress"></div>
      <button id="soundToggle" class="sound-button" type="button" aria-label="Toggle sound">
        <span id="soundIcon">♪</span> Sound
      </button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
